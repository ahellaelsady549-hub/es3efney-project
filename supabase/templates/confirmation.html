<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>تأكيد البريد الإلكتروني</title>
  </head>
  <body style="margin:0;background:#f4f7f8;font-family:Arial,sans-serif;color:#18313b">
    <main style="max-width:520px;margin:32px auto;padding:32px 24px;background:#fff;border-radius:18px;text-align:center">
      <h1 style="margin:0 0 12px;color:#0b8f8a">إسعفني</h1>
      <h2 style="font-size:20px">تأكيد البريد الإلكتروني</h2>
      <p>اكتب الرمز التالي في صفحة التسجيل لإكمال إنشاء حسابك:</p>
      <p style="display:inline-block;padding:16px 24px;border:1px dashed #0b8f8a;border-radius:12px;background:#effaf9;color:#087a75;font-size:32px;font-weight:700;letter-spacing:8px;direction:ltr">
        {{ .Token }}
      </p>
      <p style="color:#64748b;font-size:14px">إذا لم تطلب إنشاء الحساب، تجاهل هذه الرسالة.</p>
    </main>
  </body>
</html>
